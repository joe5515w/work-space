    <!DOCTYPE html>
    <html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Admin Login</title>

        <link rel="stylesheet" href="login.css">

    </head>

    <body>

        <div class="login-container">

            <form id="loginForm" class="login-box">

                <h1>Admin Login</h1>

                <p>
                    Login to access the dashboard
                </p>

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="errorMessage"></p>

            </form>

        </div>


        <script
            type="module"
            src="login.js">
        </script>

    </body>

    </html>
