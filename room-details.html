<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Details</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }


        html {
            scroll-behavior: smooth;
        }


        /* =========================
           ROOM DETAILS
        ========================= */

        .room-details {

            max-width: 1100px;

            margin: 60px auto;

            padding: 20px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 40px;

            background: white;

            border-radius: 20px;
        }


        /* =========================
           GALLERY
        ========================= */

        .room-gallery {
            width: 100%;
        }


        .main-media {

            width: 100%;

            height: 450px;

            overflow: hidden;

            border-radius: 15px;

            background: #111;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .main-media img,
        .main-media video {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 15px;
        }


        .main-media video {
            background: #000;
        }


        /* =========================
           THUMBNAILS
        ========================= */

        .gallery-thumbnails {

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 10px;

            margin-top: 12px;
        }


        .gallery-thumb {

            height: 75px;

            border: 2px solid transparent;

            border-radius: 10px;

            overflow: hidden;

            cursor: pointer;

            background: #eee;

            position: relative;

            padding: 0;
        }


        .gallery-thumb img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .gallery-thumb:hover {

            border-color: #111;
        }


        .gallery-thumb.active {

            border-color: #111;
        }


        /* Video thumbnail */

        .video-thumb::after {

            content: "▶";

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: 32px;

            height: 32px;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 13px;
        }


        /* =========================
           ROOM INFO
        ========================= */

        .room-info {
            padding: 20px;
        }


        .room-info h1 {

            font-size: 38px;

            margin-bottom: 20px;
        }


        .description {

            color: #666;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        .room-info p {

            margin-bottom: 15px;

            font-size: 17px;
        }


        .room-info h2 {

            margin-top: 25px;

            margin-bottom: 15px;
        }


        #roomFeatures {

            list-style: none;

            margin-bottom: 30px;
        }


        #roomFeatures li {

            margin-bottom: 10px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .book-btn {

            display: block;

            width: 100%;

            padding: 15px;

            background: #111;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 10px;

            font-size: 17px;
        }


        .btn {

            display: block;

            margin-top: 12px;

            margin-bottom: 12px;

            width: 50%;

            padding: 15px;

            background: #111;

            color: white;

            text-align: center;

            text-decoration: none;

            border-radius: 10px;

            font-size: 17px;
        }


        .book-btn:hover,
        .btn:hover {

            background: #333;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .room-details {

                grid-template-columns: 1fr;

                margin: 20px;

                gap: 20px;
            }


            .main-media {

                height: 300px;
            }


            .room-info h1 {

                font-size: 30px;
            }


            .gallery-thumbnails {

                grid-template-columns: repeat(4, 1fr);

                gap: 8px;
            }


            .gallery-thumb {

                height: 65px;
            }

        }


        @media (max-width: 480px) {

            .room-details {

                margin: 10px;

                padding: 12px;
            }


            .main-media {

                height: 240px;
            }


            .gallery-thumbnails {

                grid-template-columns: repeat(4, 1fr);
            }


            .gallery-thumb {

                height: 55px;
            }


            .room-info {

                padding: 10px;
            }


            .room-info h1 {

                font-size: 26px;
            }


            .btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <main class="room-details">


        <!-- =========================
             ROOM GALLERY
        ========================== -->

        <div class="room-gallery">


            <div class="main-media" id="mainMedia">

                <img
                    id="roomImage"
                    src=""
                    alt="Room"
                >

            </div>


            <div
                class="gallery-thumbnails"
                id="galleryThumbnails">
            </div>


        </div>


        <!-- =========================
             ROOM INFO
        ========================== -->

        <div class="room-info">


            <h1 id="roomName">
                Room Name
            </h1>


            <p
                class="description"
                id="roomDescription">
                Room description
            </p>


            <p>
                👥 Capacity:
                <span id="roomCapacity"></span>
            </p>


            <p>
                💰 Price:
                <span id="roomPrice"></span>
                EGP / Hour
            </p>


            <p>
                🕐 Available:
                <span id="roomFrom"></span>
                -
                <span id="roomTo"></span>
            </p>


            <h2>
                Features
            </h2>


            <ul id="roomFeatures"></ul>


            <a
                href="#"
                id="bookBtn"
                class="book-btn">
                Book Now
            </a>


            <a
                href="index.html"
                class="btn">
                Go back
            </a>


        </div>


    </main>


    <script src="room.js"></script>

    <script type="module" src="room-details.js"></script>


</body>

</html>
